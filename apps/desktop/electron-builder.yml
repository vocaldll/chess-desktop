appId: app.chessdesktop.client
productName: Chess Desktop
copyright: Copyright (c) 2026 vocal

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json

win:
  artifactName: Chess-Desktop-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  license: ../../LICENSE
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: Chess Desktop

linux:
  executableName: chess-desktop
  category: Game
  synopsis: Desktop client for Chess.com and Lichess
  artifactName: Chess-Desktop.${ext}
  target:
    - target: AppImage
      arch:
        - x64

publish:
  provider: github
  owner: vocaldll
  repo: chess-desktop
  releaseType: draft
