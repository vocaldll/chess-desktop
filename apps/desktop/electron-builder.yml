appId: app.chessdesktop.client
productName: Chess Desktop
copyright: Copyright (c) 2026 vocal

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json

win:
  artifactName: Chess-Desktop-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  buildUniversalInstaller: true
  license: ../../LICENSE
  include: resources/installer.nsh
  installerSidebar: resources/sidebar.bmp
  uninstallerSidebar: resources/sidebar.bmp
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: Chess Desktop

linux:
  executableName: chess-desktop
  category: Game
  synopsis: Desktop client for Chess.com and Lichess
  artifactName: Chess-Desktop-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64

publish:
  provider: github
  owner: vocaldll
  repo: chess-desktop
  releaseType: draft
