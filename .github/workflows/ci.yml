name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - run: pnpm build:desktop

      - run: pnpm build:web

  electron-smoke:
    name: Electron smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x64
          - os: ubuntu-24.04-arm
            platform: Linux ARM64
          - os: windows-latest
            platform: Windows x64
          - os: windows-11-arm
            platform: Windows ARM64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Electron ChromeDriver for Linux ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          electron_version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron")"
          driver_directory="$RUNNER_TEMP/electron-chromedriver"
          mkdir -p "$driver_directory"
          curl --fail --location --silent --show-error \
            "https://github.com/electron/electron/releases/download/v${electron_version}/chromedriver-v${electron_version}-linux-arm64.zip" \
            --output "$driver_directory/chromedriver.zip"
          unzip -q "$driver_directory/chromedriver.zip" -d "$driver_directory"
          chmod +x "$driver_directory/chromedriver"
          echo "ELECTRON_CHROMEDRIVER_PATH=$driver_directory/chromedriver" >> "$GITHUB_ENV"

      - run: pnpm test:e2e

  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            target: linux
          - os: windows-latest
            platform: Windows
            target: win

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build distributable
        working-directory: apps/desktop
        run: pnpm electron-vite build && pnpm electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
