name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release source and version
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release commit must be on master."
            exit 1
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version."
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

  electron-smoke:
    name: Electron smoke (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x64
          - os: ubuntu-24.04-arm
            platform: Linux ARM64
          - os: windows-latest
            platform: Windows x64
          - os: windows-11-arm
            platform: Windows ARM64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Electron ChromeDriver for Linux ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          electron_version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron")"
          driver_directory="$RUNNER_TEMP/electron-chromedriver"
          mkdir -p "$driver_directory"
          curl --fail --location --silent --show-error \
            "https://github.com/electron/electron/releases/download/v${electron_version}/chromedriver-v${electron_version}-linux-arm64.zip" \
            --output "$driver_directory/chromedriver.zip"
          unzip -q "$driver_directory/chromedriver.zip" -d "$driver_directory"
          chmod +x "$driver_directory/chromedriver"
          echo "ELECTRON_CHROMEDRIVER_PATH=$driver_directory/chromedriver" >> "$GITHUB_ENV"

      - run: pnpm test:e2e

  release:
    needs: [verify, electron-smoke]
    timeout-minutes: 30

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and publish
        working-directory: apps/desktop
        run: pnpm electron-vite build && pnpm electron-builder --${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
